<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <meta name="description" content="우리 가족 오늘의 주인공을 재미있는 룰렛으로 뽑아보세요." />
  <title>오늘의 주인공 | 우리집 랜덤 뽑기</title>
  <style>
    :root { --ink:#252b39; --muted:#777d8b; --paper:#f7f4ee; --white:#fff; --purple:#7655e8; --purple-dark:#5839cb; --line:#e7e4e2; --shadow:0 24px 65px rgba(52,42,84,.09); }
    * { box-sizing:border-box; }
    html { -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100vh; font-family:Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; color:var(--ink); background:radial-gradient(circle at 8% 0%, #f5e7fe 0,transparent 32%),radial-gradient(circle at 100% 90%,#e7eefb 0,transparent 36%),var(--paper); }
    button,input {font:inherit;}
    button {cursor:pointer;}
    button:focus-visible,input:focus-visible {outline:3px solid #b5a2ff;outline-offset:3px;}
    .shell {width:min(1180px,calc(100% - 40px)); margin:0 auto; padding:32px 0 40px;}
    header {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:39px;}
    .brand {display:flex;align-items:center;gap:10px;font-size:17px;font-weight:850;letter-spacing:-.7px;}
    .brand-mark {display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#282839;color:#fff;font-size:19px;}
    .date {color:#777786;font-size:13px;font-weight:700;background:#fff9;border:1px solid #fff;padding:10px 15px;border-radius:20px;}
    .eyebrow {display:inline-flex;gap:7px;align-items:center;color:#7453da;font-size:13px;font-weight:850;letter-spacing:.1em;}
    .eyebrow::before {content:"";width:7px;height:7px;border-radius:50%;background:#ad83f9;}
    h1 {font-size:clamp(36px,5.2vw,64px);letter-spacing:-.075em;line-height:1.18;margin:14px 0 13px;font-weight:900;}
    h1 em {font-style:normal;color:var(--purple);}
    .lead {margin:0;color:var(--muted);font-size:16px;line-height:1.8;word-break:keep-all;}
    .intro {margin-bottom:31px;}
    .main-grid {display:grid;grid-template-columns:minmax(0,1.34fr) minmax(310px,.86fr);gap:22px;align-items:stretch;}
    .panel {background:rgba(255,255,255,.93);border:1px solid #fff;border-radius:30px;box-shadow:var(--shadow);}
    .wheel-panel {min-width:0;padding:26px 26px 27px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;}
    .panel-top {width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    h2 {margin:0;font-size:19px;letter-spacing:-.05em;font-weight:850;}
    .small-chip {font-size:12px;color:#7768bc;background:#f2edff;padding:9px 13px;border-radius:100px;font-weight:800;white-space:nowrap;}
    .wheel-area {position:relative;width:min(100%,465px);aspect-ratio:1;margin:24px auto 15px;display:grid;place-items:center;}
    .wheel-halo {position:absolute;inset:2%;border-radius:50%;background:#ede7fa;box-shadow:0 16px 50px #8d69d629;}
    #wheel {position:relative;width:93%;height:93%;border-radius:50%;filter:drop-shadow(0 8px 10px #3d275f21);transform:rotate(0deg);will-change:transform;}
    .pointer {position:absolute;z-index:3;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:31px solid #27283b;filter:drop-shadow(0 3px 2px #26233627);}
    .center-cap {position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:65px;height:65px;border:8px solid #fff;border-radius:50%;background:#2b2940;color:#fff;font-size:23px;box-shadow:0 4px 15px #231e3a3d;pointer-events:none;}
    .wheel-label {position:absolute;top:50%;left:50%;height:30px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(11px,1.5vw,16px);font-weight:900;line-height:1.15;white-space:nowrap;transform-origin:center;pointer-events:none;user-select:none;}
    .spin {border:0;background:var(--purple);color:white;border-radius:18px;min-height:59px;width:min(100%,340px);font-size:18px;font-weight:900;letter-spacing:-.03em;box-shadow:0 11px 20px #7452d72b;transition:transform .18s,background .18s,box-shadow .18s;}
    .spin:hover:not(:disabled) {transform:translateY(-2px);background:var(--purple-dark);box-shadow:0 15px 24px #7452d744;}
    .spin:active:not(:disabled) {transform:translateY(1px) scale(.98);}
    button:disabled {opacity:.5;cursor:not-allowed;}
    .wheel-hint {margin:13px 0 0;color:#9996a2;font-size:12px;text-align:center;}
    .side {display:flex;flex-direction:column;gap:20px;min-width:0;}
    .list-panel {padding:26px;flex:1;}
    .section-top {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
    .count {color:var(--purple);font-size:13px;font-weight:900;}
    .sub {color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 17px;}
    .form {display:flex;gap:9px;}
    .form input {min-width:0;flex:1;border:1.5px solid #ece9f0;background:#faf9fc;border-radius:13px;padding:0 14px;height:48px;outline:none;font-size:14px;transition:border .2s,background .2s;}
    .form input:focus {border-color:#997efa;background:#fff;}
    .add {border:0;border-radius:13px;background:#2b2c3c;color:#fff;padding:0 19px;font-weight:800;white-space:nowrap;}
    .add:hover {background:#444357;}
    .members {list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;max-height:310px;overflow:auto;}
    .member {display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:#faf9fc;border:1px solid #f3f1f5;min-height:54px;}
    .avatar {width:33px;height:33px;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:900;flex-shrink:0;}
    .member-name {min-width:0;flex:1;font-size:14px;font-weight:800;overflow-wrap:anywhere;}
    .remove {border:0;background:transparent;color:#aaa6b2;border-radius:9px;width:30px;height:30px;font-size:21px;line-height:1;display:grid;place-items:center;}
    .remove:hover {background:#f1eaf9;color:#6d4cc7;}
    .actions {display:flex;justify-content:space-between;gap:9px;margin-top:18px;flex-wrap:wrap;}
    .text-btn {border:0;background:transparent;color:#878393;padding:6px 0;font-size:12px;font-weight:750;}
    .text-btn:hover {color:var(--purple);}
    .result-panel {padding:23px 25px;background:#2e2b43;color:#fff;overflow:hidden;position:relative;min-height:172px;}
    .result-panel::after {content:"✦";position:absolute;right:23px;top:27px;font-size:55px;color:#ffffff15;}
    .result-kicker {color:#cfc7eb;font-size:12px;font-weight:800;letter-spacing:.05em;}
    #winner {font-size:32px;font-weight:900;letter-spacing:-.06em;min-height:42px;margin:13px 0 7px;overflow-wrap:anywhere;}
    #result-msg {font-size:13px;color:#d1cbdf;line-height:1.5;}
    .history {display:flex;flex-wrap:wrap;gap:7px;margin-top:15px;}
    .history span {color:#e5dffe;background:#ffffff1c;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:700;}
    footer {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px;color:#99939e;font-size:12px;}
    .sound-switch {border:0;background:transparent;color:#898394;font-size:12px;font-weight:750;display:inline-flex;gap:5px;align-items:center;}
    .toast {position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);background:#2d2940;color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:15;max-width:calc(100% - 30px);text-align:center;}
    .toast.show {opacity:1;transform:translate(-50%,0);}
    .confetti {position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;}
    .confetti i {position:absolute;top:-20px;display:block;width:9px;height:15px;animation:fall var(--duration) linear forwards;animation-delay:var(--delay);opacity:0;}
    @keyframes fall {0%{opacity:1;transform:translate3d(0,-30px,0) rotate(0)}100%{opacity:1;transform:translate3d(var(--drift),105vh,0) rotate(800deg)}}
    .spark {animation:pop .5s ease both;} @keyframes pop {0%{transform:scale(.8);opacity:.2}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
    @media (min-width:900px) and (max-height:850px) {.wheel-area{width:min(100%,390px)}}
    @media(max-width:800px){.shell{width:min(620px,calc(100% - 28px));padding:20px 0 30px;}header{margin-bottom:27px}.intro{margin-bottom:25px}.main-grid{grid-template-columns:1fr;gap:16px}.wheel-panel{padding:21px 18px 24px}.wheel-area{width:min(100%,440px);margin:17px auto 10px}.list-panel{padding:22px}.side{gap:16px}.result-panel{min-height:155px}footer{padding:0 3px}}
    @media(max-width:440px){.shell{width:calc(100% - 24px)}.date{padding:8px 10px;font-size:11px}.brand{font-size:15px}.brand-mark{width:34px;height:34px}h1{font-size:39px}.lead{font-size:14px}.panel{border-radius:23px}.wheel-label{font-size:12px}.wheel-area{width:100%}.pointer{border-left-width:13px;border-right-width:13px;border-top-width:26px}.center-cap{width:55px;height:55px;border-width:6px}.spin{font-size:16px;min-height:55px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>우리집 작은 이벤트</span></div>
      <div class="date" id="today"></div>
    </header>
    <section class="intro" aria-labelledby="heading">
      <div class="eyebrow">TODAY'S LUCKY STAR</div>
      <h1 id="heading">오늘의 <em>주인공</em>은?</h1>
      <p class="lead">오늘은 누가 특별한 하루의 주인공이 될까요?<br>우리 가족의 이름을 넣고, 행운의 룰렛을 돌려보세요!</p>
    </section>
    <main class="main-grid">
      <section class="panel wheel-panel" aria-labelledby="roulette-title">
        <div class="panel-top"><h2 id="roulette-title">행운의 룰렛</h2><span class="small-chip">✦ 두근두근 랜덤 추첨</span></div>
        <div class="wheel-area" aria-label="가족 이름이 표시된 룰렛">
          <div class="wheel-halo"></div>
          <div id="wheel"></div>
          <div class="pointer" aria-hidden="true"></div>
          <div class="center-cap" aria-hidden="true">✦</div>
        </div>
        <button type="button" class="spin" id="spin">✦ &nbsp; 주인공 뽑기!</button>
        <p class="wheel-hint">누구나 공평하게! 한 번씩 두근두근 🎈</p>
      </section>
      <aside class="side">
        <section class="panel list-panel" aria-labelledby="family-title">
          <div class="section-top"><h2 id="family-title">우리 가족 명단</h2><span class="count" id="count">0명 참여 중</span></div>
          <p class="sub">이름을 자유롭게 추가하거나 삭제할 수 있어요.</p>
          <form class="form" id="form"><input id="nameInput" type="text" maxlength="16" placeholder="이름을 입력하세요" aria-label="추가할 가족 이름" autocomplete="off" required /><button class="add" type="submit">+ 추가</button></form>
          <ul class="members" id="members" aria-label="참여자 명단"></ul>
          <div class="actions"><button class="text-btn" id="resetNames" type="button">↺ 기본 명단으로</button><button class="text-btn" id="clearNames" type="button">전체 삭제</button></div>
        </section>
        <section class="panel result-panel" aria-live="polite" aria-atomic="true">
          <div class="result-kicker">🏆 &nbsp; TODAY'S STAR</div>
          <div id="winner">아직 비밀이에요!</div>
          <div id="result-msg">룰렛을 돌려 오늘의 주인공을 만나보세요.</div>
          <div class="history" id="history" aria-label="최근 당첨 결과"></div>
        </section>
      </aside>
    </main>
    <footer><span>우리 가족의 소소한 행복을 위한 룰렛 ♡</span><button class="sound-switch" id="sound" type="button" aria-pressed="false">♪ 효과음 끔</button></footer>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    (()=>{
      'use strict';
      const KEY='family-roulette-names-v1', HISTORY_KEY='family-roulette-history-v1', SOUND_KEY='family-roulette-sound-v1';
      const defaults=['아빠','엄마','첫째','둘째'];
      const palette=['#b6a1f4','#ffbea5','#f8d982','#9edbd0','#9ac9f7','#f4b6d1','#c6d9a3','#d8b5f1','#ffc7a6','#a6dcf0'];
      const $=id=>document.getElementById(id);
      const safeParse=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:fallback;}catch{return fallback;}};
      let names=safeParse(KEY,defaults).filter(v=>typeof v==='string'&&v.trim()).slice(0,24);
      let history=safeParse(HISTORY_KEY,[]).filter(v=>typeof v==='string').slice(0,4);
      let soundOn=localStorage.getItem(SOUND_KEY)==='true';
      let spinning=false, rotation=0, spinTimer=null, audioCtx=null, toastTimer=null;
      const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
      $('today').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
      function save(){try{localStorage.setItem(KEY,JSON.stringify(names));localStorage.setItem(HISTORY_KEY,JSON.stringify(history));}catch{}}
      function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400);}
      function draw(){
        const wheel=$('wheel'); wheel.replaceChildren();
        const n=names.length,step=n?360/n:360;
        wheel.style.background=n?`conic-gradient(from ${-step/2}deg,${names.map((_,i)=>`${palette[i%palette.length]} ${i*step}deg ${(i+1)*step}deg`).join(',')})`:'#eae5f1';
        if(!n){const label=document.createElement('span');label.textContent='이름을 추가해 주세요';label.style.cssText='position:absolute;inset:0;display:grid;place-items:center;font-weight:850;color:#8d8496;text-align:center;padding:40px';wheel.append(label);return;}
        names.forEach((name,i)=>{
          const angle=i*step*Math.PI/180;
          const label=document.createElement('span');label.className='wheel-label';label.textContent=name;
          // Center of the segment is at angle 0 (12 o'clock), then clockwise.
          const r=n===1?0:n===2?27:n<=5?30:n<=10?34:36;
          label.style.left=`${50+Math.sin(angle)*r}%`;
          label.style.top=`${50-Math.cos(angle)*r}%`;
          label.style.width=`${n>12?20:n>8?24:n>5?29:35}%`;
          label.style.transform='translate(-50%,-50%)';
          label.style.fontSize=n>15?'10px':n>10?'11px':n>7?'12px':'';
          wheel.append(label);
        });
      }
      function renderMembers(){
        const root=$('members');root.replaceChildren();
        $('count').textContent=`${names.length}명 참여 중`;
        names.forEach((name,i)=>{
          const li=document.createElement('li');li.className='member';
          const avatar=document.createElement('span');avatar.className='avatar';avatar.style.background=palette[i%palette.length]+'88';avatar.style.color='#39334a';avatar.textContent=name[0];
          const nameSpan=document.createElement('span');nameSpan.className='member-name';nameSpan.textContent=name;
          const btn=document.createElement('button');btn.className='remove';btn.type='button';btn.textContent='×';btn.setAttribute('aria-label',`${name} 삭제`);
          btn.addEventListener('click',()=>{if(spinning)return;names.splice(i,1);updated();});
          li.append(avatar,nameSpan,btn);root.append(li);
        });
        $('spin').disabled=spinning||names.length===0;
      }
      function renderHistory(){const el=$('history');el.replaceChildren();history.forEach(name=>{let s=document.createElement('span');s.textContent=`✦ ${name}`;el.append(s);});}
      function updated(){save();draw();renderMembers();renderHistory();}
      $('form').addEventListener('submit',e=>{
        e.preventDefault();if(spinning)return;
        const v=$('nameInput').value.trim().replace(/\s+/g,' ');
        if(!v){toast('이름을 입력해 주세요.');return;}
        if(names.length>=24){toast('최대 24명까지 추가할 수 있어요.');return;}
        if(names.includes(v)){toast('이미 명단에 있는 이름이에요.');return;}
        names.push(v);$('nameInput').value='';updated();$('nameInput').focus();toast(`${v}님이 추가되었어요!`);
      });
      $('resetNames').addEventListener('click',()=>{if(spinning)return;names=[...defaults];history=[];resetResult();updated();toast('기본 명단으로 돌아왔어요.');});
      $('clearNames').addEventListener('click',()=>{if(spinning)return;names=[];history=[];resetResult();updated();toast('명단을 모두 비웠어요.');});
      function resetResult(){$('winner').textContent='아직 비밀이에요!';$('result-msg').textContent='룰렛을 돌려 오늘의 주인공을 만나보세요.';}
      function beep(freq=500,duration=.08,type='sine'){
        if(!soundOn)return;
        try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const oscillator=audioCtx.createOscillator();const gain=audioCtx.createGain();oscillator.type=type;oscillator.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.075,audioCtx.currentTime+.012);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);oscillator.connect(gain).connect(audioCtx.destination);oscillator.start();oscillator.stop(audioCtx.currentTime+duration+.01);}catch{}
      }
      function celebrate(){if(reduced.matches)return;const root=$('confetti');root.replaceChildren();for(let i=0;i<85;i++){const piece=document.createElement('i');piece.style.left=Math.random()*100+'%';piece.style.background=palette[i%palette.length];piece.style.borderRadius=i%3?'2px':'50%';piece.style.setProperty('--duration',(2+Math.random()*2.6)+'s');piece.style.setProperty('--delay',(Math.random()*.55)+'s');piece.style.setProperty('--drift',((Math.random()-.5)*220)+'px');root.append(piece);}setTimeout(()=>root.replaceChildren(),5300);}
      $('spin').addEventListener('click',()=>{
        if(spinning||!names.length)return;
        spinning=true;renderMembers();$('spin').textContent='두근두근... 🎲';$('winner').textContent='누가 될까요?';$('result-msg').textContent='행운이 돌고 있어요!';
        const n=names.length,idx=Math.floor(Math.random()*n),step=360/n;
        const current=((rotation%360)+360)%360;
        const target=((360-idx*step)%360+360)%360;
        const delta=(target-current+360)%360;
        rotation+=360*(5+Math.floor(Math.random()*3))+delta;
        const duration=reduced.matches?50:4600;
        const wheel=$('wheel');wheel.style.transition=`transform ${duration}ms cubic-bezier(.13,.75,.13,1)`;
        requestAnimationFrame(()=>{requestAnimationFrame(()=>{wheel.style.transform=`rotate(${rotation}deg)`;});});
        beep(390,.12);
        clearTimeout(spinTimer);
        spinTimer=setTimeout(()=>{
          spinning=false;
          const picked=names[idx];history.unshift(picked);history=history.slice(0,4);save();renderHistory();renderMembers();
          $('spin').textContent='✦  다시 뽑기!';$('winner').textContent=`🎉 ${picked}!`;$('winner').classList.remove('spark');void $('winner').offsetWidth;$('winner').classList.add('spark');
          $('result-msg').textContent='축하해요! 오늘의 주인공으로 선정됐어요 ✨';
          beep(523,.18);setTimeout(()=>beep(659,.19),140);setTimeout(()=>beep(784,.3),280);celebrate();
        },duration+70);
      });
      function renderSound(){$('sound').textContent=soundOn?'♫ 효과음 켬':'♪ 효과음 끔';$('sound').setAttribute('aria-pressed',String(soundOn));}
      $('sound').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem(SOUND_KEY,String(soundOn));}catch{}renderSound();if(soundOn)beep(700,.1);});
      renderSound();updated();
    })();
  </script>
</body>
</html>
